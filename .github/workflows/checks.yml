name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflow:
    name: TestFlow build and API safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/testflow
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/testflow/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Test domain logic and unconfigured API safeguards
        shell: bash
        run: |
          npm start -- --hostname 127.0.0.1 --port 3030 > /tmp/testflow-ci.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3030/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3030/ > /dev/null || { cat /tmp/testflow-ci.log; exit 1; }
          TESTFLOW_UNCONFIGURED_URL=http://127.0.0.1:3030 npm test

  check:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Install and verify environment
        run: python scripts/bootstrap.py
      - name: Lint and formatting
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m ruff check .
          "$PY" -m ruff format --check .
      - name: Run tests and repository checks
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m unittest discover -s tests -v
          "$PY" scripts/check_repository.py
      - name: Check whitespace in committed changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
