[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haiquayxe-hackathon"
version = "0.1.0"
description = "Team HaiQuayXe's shared tools for the RMIT Hackathon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["pandas>=3.0.6,<3.1", "scikit-learn>=1.9.1,<1.10"]

[project.scripts]
hq = "haiquayxe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
